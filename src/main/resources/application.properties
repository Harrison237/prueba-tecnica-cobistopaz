spring.application.name=prueba-tecnica

#DATABASE
spring.datasource.url=jdbc:mysql://localhost/cobisTopazPrueba?useSSL=false
spring.datasource.dbname=cobisTopazPrueba
spring.datasource.username=app_user
spring.datasource.password=app_pass
spring.datasource.port=3306
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#JWT
security.jwt.secret=CONFIGURAR_UN_SECRET_MAS_SEGURO
security.jwt.expiretime=604800000

#SPRINGDOC
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
